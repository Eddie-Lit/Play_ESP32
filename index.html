<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 舵机与 LED 蓝牙控制器</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border-color: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-amber: #d29922;
      --accent-red: #f85149;
      --led-glow-on: 0 0 40px rgba(59, 130, 246, 0.9), 0 0 70px rgba(59, 130, 246, 0.5);
      --led-glow-off: 0 0 10px rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #161b22, #090d13);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #58a6ff, #a5d6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .pin-info-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
      font-size: 12px;
    }

    .pin-tag {
      background: #21262d;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px 8px;
      color: #c9d1d9;
    }

    .alert {
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid var(--accent-red);
      color: #ff7b72;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .device-name {
      font-size: 14px;
      font-weight: 600;
      color: #c9d1d9;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #21262d;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .badge.connected {
      background: rgba(63, 185, 80, 0.15);
      color: var(--accent-green);
      border-color: rgba(63, 185, 80, 0.4);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Dual Visual Stage (Servo Needle + LED Bulb) */
    .visual-stage {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
      align-items: center;
    }

    .visual-box {
      background: rgba(13, 17, 23, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      position: relative;
    }

    .visual-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Servo Semi-Circle Gauge */
    .gauge-wrapper {
      position: relative;
      width: 130px;
      height: 75px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .gauge-arc {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 10px solid #21262d;
      border-top-color: #58a6ff;
      border-left-color: #58a6ff;
      transform: rotate(45deg);
      box-sizing: border-box;
    }

    .gauge-needle {
      position: absolute;
      bottom: 0;
      left: 65px;
      width: 3px;
      height: 55px;
      background: linear-gradient(to top, #58a6ff, #ffffff);
      transform-origin: bottom center;
      transform: rotate(-90deg);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 2px 2px 0 0;
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.8);
    }

    .gauge-pivot {
      position: absolute;
      bottom: -4px;
      left: 61px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #58a6ff;
      box-shadow: 0 0 6px #58a6ff;
    }

    .gauge-value {
      font-size: 20px;
      font-weight: 700;
      color: #58a6ff;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    /* LED Bulb */
    .bulb {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #21262d;
      border: 3px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--led-glow-off);
      margin-bottom: 8px;
    }

    .bulb svg {
      width: 32px;
      height: 32px;
      fill: #484f58;
      transition: all 0.3s ease;
    }

    .bulb.on {
      background: radial-gradient(circle, #60a5fa, #2563eb);
      border-color: #93c5fd;
      box-shadow: var(--led-glow-on);
    }

    .bulb.on svg {
      fill: #ffffff;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
    }

    .bulb-status {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
      transition: color 0.3s ease;
    }

    .bulb-status.on {
      color: #3fb950;
    }

    /* Main One-Click Action Button */
    .btn-oneclick {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: #ffffff;
      background: linear-gradient(135deg, #1f6feb, #238636);
      box-shadow: 0 4px 14px rgba(31, 111, 235, 0.3);
      margin-bottom: 16px;
    }

    .btn-oneclick:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(31, 111, 235, 0.45);
    }

    .btn-oneclick:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-oneclick:disabled {
      background: #21262d;
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
      border: 1px solid var(--border-color);
    }

    .btn-oneclick.state-0 {
      background: linear-gradient(135deg, #238636, #2ea043);
      box-shadow: 0 4px 14px rgba(46, 160, 67, 0.35);
    }

    .btn-oneclick.state-180 {
      background: linear-gradient(135deg, #da3633, #f85149);
      box-shadow: 0 4px 14px rgba(248, 81, 73, 0.35);
    }

    /* Slider & Presets Section */
    .slider-section {
      background: rgba(13, 17, 23, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      color: #c9d1d9;
    }

    .slider-header span.tip {
      font-size: 11px;
      color: var(--accent-amber);
    }

    input[type=range] {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #21262d;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #58a6ff;
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px rgba(88, 166, 255, 0.6);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .presets-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-preset {
      flex: 1;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 600;
      background: #21262d;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #c9d1d9;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-preset:hover:not(:disabled) {
      background: #30363d;
      color: #ffffff;
      border-color: #58a6ff;
    }

    .btn-preset:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    /* Bluetooth Actions */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }

    .btn-connect {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid rgba(88, 166, 255, 0.4);
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent-blue);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-connect:hover {
      background: rgba(88, 166, 255, 0.25);
    }

    .btn-disconnect {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #21262d;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-disconnect:hover:not(:disabled) {
      background: rgba(248, 81, 73, 0.15);
      color: var(--accent-red);
      border-color: rgba(248, 81, 73, 0.4);
    }

    .btn-disconnect:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Log Box */
    .log-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(12px);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .log-title {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-clear {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      padding: 2px 6px;
      cursor: pointer;
    }

    .btn-clear:hover {
      color: var(--text-main);
    }

    .log-box {
      background: #010409;
      border: 1px solid #21262d;
      border-radius: 6px;
      height: 140px;
      overflow-y: auto;
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #8b949e;
    }

    .log-entry {
      margin-bottom: 3px;
      word-break: break-all;
    }

    .log-entry.info { color: #58a6ff; }
    .log-entry.success { color: #3fb950; }
    .log-entry.warn { color: #d29922; }
    .log-entry.error { color: #f85149; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>ESP32 舵机与 LED 蓝牙控制面板</h1>
    <p>Web Bluetooth API 实时双向联动</p>
    <div class="pin-info-row">
      <span class="pin-tag">⚙️ 舵机 (0°~180°): <b>GPIO 2</b></span>
      <span class="pin-tag">💡 LED 灯: <b>GPIO 4</b></span>
      <span class="pin-tag">🎛️ 旋钮: <b>GPIO 18/19/21</b></span>
    </div>
  </div>

  <div id="secureAlert" class="alert">
    ⚠️ <strong>环境提示：</strong> Web Bluetooth API 仅在 HTTPS 或 <code>http://localhost</code> 安全环境中可用。
  </div>

  <div class="card">
    <div class="status-row">
      <span class="device-name" id="deviceName">设备状态：未连接</span>
      <div class="badge" id="statusBadge">
        <div class="badge-dot"></div>
        <span id="statusText">未连接</span>
      </div>
    </div>

    <!-- Dual Visualizer: Servo Dial & LED Bulb -->
    <div class="visual-stage">
      <div class="visual-box">
        <div class="visual-label">GPIO 2 舵机角度</div>
        <div class="gauge-wrapper">
          <div class="gauge-arc"></div>
          <div class="gauge-needle" id="gaugeNeedle"></div>
          <div class="gauge-pivot"></div>
        </div>
        <div class="gauge-value" id="gaugeValue">0°</div>
      </div>

      <div class="visual-box">
        <div class="visual-label">GPIO 4 LED 状态</div>
        <div class="bulb" id="bulbIcon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7zm-2 17h4v1h-4v-1zm1-15c0-.55.45-1 1-1s1 .45 1 1-.45 1 1-1 1-1-.45-1-1zm1 19c-.55 0-1-.45-1-1h2c0 .55-.45 1-1 1z"/>
          </svg>
        </div>
        <div class="bulb-status" id="bulbStatus">关灯 (0)</div>
      </div>
    </div>

    <!-- Primary One-Click Toggle Button -->
    <button id="oneClickBtn" class="btn-oneclick state-0" disabled>
      🔘 一键转到 180° (开灯)
    </button>

    <!-- Angle Slider & Presets -->
    <div class="slider-section">
      <div class="slider-header">
        <span><b>角度连续调节</b> (或旋转硬件旋钮)</span>
        <span class="tip" id="sliderValDisplay">0°</span>
      </div>
      <input type="range" id="angleSlider" min="0" max="180" value="0" disabled>
      <div class="presets-row">
        <button class="btn-preset" data-angle="0" disabled>0° (关灯)</button>
        <button class="btn-preset" data-angle="45" disabled>45°</button>
        <button class="btn-preset" data-angle="90" disabled>90°</button>
        <button class="btn-preset" data-angle="135" disabled>135°</button>
        <button class="btn-preset" data-angle="180" disabled>180° (开灯)</button>
      </div>
    </div>

    <!-- Bluetooth Connect / Disconnect Buttons -->
    <div class="controls">
      <button id="connectBtn" class="btn-connect">🔍 扫描并连接设备</button>
      <button id="disconnectBtn" class="btn-disconnect" disabled>断开连接</button>
    </div>

    <button id="scanAllBtn" class="btn-connect" style="width: 100%; background: #30363d; color: #c9d1d9; font-size: 12px; padding: 8px;">
      🌐 扫描全部附近蓝牙设备 (不过滤名称)
    </button>

    <button id="directConnectBtn" class="btn-connect" style="display: none; width: 100%; margin-top: 8px; background: #1f6feb; color: #fff;">
      ⚡ 直接连接已配对设备
    </button>
  </div>

  <div class="log-card">
    <div class="log-header">
      <span class="log-title">实时通信日志 (Event Log)</span>
      <button id="clearLogBtn" class="btn-clear">清空日志</button>
    </div>
    <div class="log-box" id="logBox"></div>
  </div>
</div>

<script>
  // UUIDs matching ESP32 firmware
  const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
  const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

  let bluetoothDevice = null;
  let devCharacteristic = null;
  let currentAngle = 0;
  let currentLedState = 0;

  const connectBtn = document.getElementById('connectBtn');
  const disconnectBtn = document.getElementById('disconnectBtn');
  const oneClickBtn = document.getElementById('oneClickBtn');
  const angleSlider = document.getElementById('angleSlider');
  const sliderValDisplay = document.getElementById('sliderValDisplay');
  const statusBadge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');
  const deviceName = document.getElementById('deviceName');
  const gaugeNeedle = document.getElementById('gaugeNeedle');
  const gaugeValue = document.getElementById('gaugeValue');
  const bulbIcon = document.getElementById('bulbIcon');
  const bulbStatus = document.getElementById('bulbStatus');
  const logBox = document.getElementById('logBox');
  const clearLogBtn = document.getElementById('clearLogBtn');
  const secureAlert = document.getElementById('secureAlert');
  const presetBtns = document.querySelectorAll('.btn-preset');

  // Check browser Bluetooth capability
  if (!window.isSecureContext) {
    secureAlert.style.display = 'block';
    secureAlert.innerHTML = '⚠️ <strong>安全环境限制：</strong> 当前网址非 HTTPS 或 localhost 环境。<br>浏览器已禁用 Web Bluetooth 蓝牙接口。';
  } else if (!navigator.bluetooth) {
    secureAlert.style.display = 'block';
    secureAlert.innerHTML = '⚠️ <strong>浏览器未开放蓝牙接口：</strong> 当前浏览器不支持 Web Bluetooth API。<br>请使用 Chrome、Edge 浏览器访问。';
  }

  function log(message, type = 'normal') {
    const now = new Date();
    const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.textContent = `[${timeStr}] ${message}`;
    logBox.appendChild(entry);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function updateVisuals(angle, ledState) {
    currentAngle = angle;
    currentLedState = ledState;

    // 1. Update Gauge: 0 deg -> -90 deg (left), 180 deg -> +90 deg (right)
    const needleDeg = (angle / 180) * 180 - 90;
    gaugeNeedle.style.transform = `rotate(${needleDeg}deg)`;
    gaugeValue.textContent = `${angle}°`;
    sliderValDisplay.textContent = `${angle}°`;
    angleSlider.value = angle;

    // 2. Update LED Bulb
    if (ledState) {
      bulbIcon.classList.add('on');
      bulbStatus.textContent = '开灯 (1)';
      bulbStatus.classList.add('on');
    } else {
      bulbIcon.classList.remove('on');
      bulbStatus.textContent = '关灯 (0)';
      bulbStatus.classList.remove('on');
    }

    // 3. Update One-Click Toggle Button
    if (angle >= 90) {
      oneClickBtn.className = 'btn-oneclick state-180';
      oneClickBtn.textContent = '🔘 一键切换到 0° (关灯)';
    } else {
      oneClickBtn.className = 'btn-oneclick state-0';
      oneClickBtn.textContent = '🔘 一键切换到 180° (开灯)';
    }
  }

  function setControlsEnabled(enabled) {
    connectBtn.disabled = enabled;
    disconnectBtn.disabled = !enabled;
    oneClickBtn.disabled = !enabled;
    angleSlider.disabled = !enabled;
    presetBtns.forEach(btn => btn.disabled = !enabled);

    if (enabled) {
      statusBadge.className = 'badge connected';
      statusText.textContent = '已连接';
    } else {
      statusBadge.className = 'badge';
      statusText.textContent = '未连接';
      deviceName.textContent = '设备状态：未连接';
    }
  }

  async function connect() {
    if (!navigator.bluetooth) {
      alert('当前浏览器不支持 Web Bluetooth API，请使用 Chrome 或 Edge 打开！');
      return;
    }

    try {
      log('正在扫描设备 [ESP32-BLE-LED]...', 'info');
      bluetoothDevice = await navigator.bluetooth.requestDevice({
        filters: [
          { name: 'ESP32-BLE-LED' },
          { namePrefix: 'ESP32' }
        ],
        optionalServices: [SERVICE_UUID]
      });
      await connectGatt(bluetoothDevice);
    } catch (error) {
      log('扫描或连接已取消: ' + error.message, 'error');
      onDisconnected();
    }
  }

  async function connectGatt(device) {
    try {
      deviceName.textContent = `设备：${device.name || 'ESP32'}`;
      log(`正在建立 GATT 连接: ${device.name}...`, 'info');

      device.removeEventListener('gattserverdisconnected', onDisconnected);
      device.addEventListener('gattserverdisconnected', onDisconnected);

      let server = null;
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          server = await device.gatt.connect();
          if (server && server.connected) break;
        } catch (err) {
          log(`连接尝试 ${attempt} 失败: ${err.message}，重试中...`, 'warn');
          if (attempt === 3) throw err;
          await new Promise(r => setTimeout(r, 800));
        }
      }

      log('获取主服务: ' + SERVICE_UUID, 'info');
      const service = await server.getPrimaryService(SERVICE_UUID);

      log('获取特征值: ' + CHARACTERISTIC_UUID, 'info');
      devCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

      // Read initial state
      log('读取当前设备状态...', 'info');
      const initialValue = await devCharacteristic.readValue();
      let initAngle = 0;
      let initLed = 0;
      if (initialValue.byteLength >= 2) {
        initAngle = initialValue.getUint8(0);
        initLed = initialValue.getUint8(1);
      } else if (initialValue.byteLength === 1) {
        initAngle = initialValue.getUint8(0);
        initLed = (initAngle >= 90) ? 1 : 0;
      }
      log(`读取成功: 舵机当前 ${initAngle}°，LED 当前 ${initLed ? '开' : '关'}`, 'success');

      // Start notifications
      log('启用设备状态变更实时通知...', 'info');
      await devCharacteristic.startNotifications();
      devCharacteristic.removeEventListener('characteristicvaluechanged', onCharacteristicChanged);
      devCharacteristic.addEventListener('characteristicvaluechanged', onCharacteristicChanged);

      setControlsEnabled(true);
      updateVisuals(initAngle, initLed);
      log('✅ 蓝牙连接成功！可一键切换或旋转旋钮操控。', 'success');

      const directBtn = document.getElementById('directConnectBtn');
      if (directBtn) directBtn.style.display = 'none';

    } catch (error) {
      log('GATT 连接异常: ' + error.message, 'error');
      onDisconnected();
    }
  }

  function onCharacteristicChanged(event) {
    const value = event.target.value;
    let angle = 0;
    let led = 0;
    if (value.byteLength >= 2) {
      angle = value.getUint8(0);
      led = value.getUint8(1);
    } else if (value.byteLength === 1) {
      angle = value.getUint8(0);
      led = (angle >= 90) ? 1 : 0;
    }
    log(`[硬件同步] 舵机角度 -> ${angle}°，LED -> ${led ? '开灯 (1)' : '关灯 (0)'}`, 'info');
    updateVisuals(angle, led);
  }

  function onDisconnected() {
    log('蓝牙连接已断开', 'warn');
    devCharacteristic = null;
    bluetoothDevice = null;
    setControlsEnabled(false);
  }

  // Send angle & LED command
  async function sendCommand(angle, led) {
    if (!devCharacteristic) return;
    try {
      log(`发送指令: 舵机 ${angle}°，LED ${led ? '开' : '关'}...`, 'info');
      // Send 2 bytes [angle, led]
      await devCharacteristic.writeValue(new Uint8Array([angle, led]));
      updateVisuals(angle, led);
    } catch (error) {
      log('发送失败: ' + error.message, 'error');
    }
  }

  // Primary One-Click Action: toggle between (0°, LED 0) and (180°, LED 1)
  async function handleOneClick() {
    if (currentAngle >= 90) {
      // Toggle to 0 deg and LED OFF
      await sendCommand(0, 0);
    } else {
      // Toggle to 180 deg and LED ON
      await sendCommand(180, 1);
    }
  }

  // Slider change
  let sliderThrottle = null;
  angleSlider.addEventListener('input', (e) => {
    const angle = parseInt(e.target.value, 10);
    const led = angle >= 90 ? 1 : 0;
    updateVisuals(angle, led);

    if (sliderThrottle) clearTimeout(sliderThrottle);
    sliderThrottle = setTimeout(() => {
      sendCommand(angle, led);
    }, 60);
  });

  // Presets
  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const angle = parseInt(btn.getAttribute('data-angle'), 10);
      const led = angle >= 90 ? 1 : 0;
      sendCommand(angle, led);
    });
  });

  async function initKnownDevices() {
    if (navigator.bluetooth && navigator.bluetooth.getDevices) {
      try {
        const devices = await navigator.bluetooth.getDevices();
        const esp = devices.find(d => d.name === 'ESP32-BLE-LED' || d.name?.startsWith('ESP32'));
        if (esp) {
          log(`发现已配对设备: ${esp.name}`, 'info');
          bluetoothDevice = esp;
          deviceName.textContent = `设备：${esp.name} (已配对)`;
          const directBtn = document.getElementById('directConnectBtn');
          if (directBtn) {
            directBtn.style.display = 'block';
            directBtn.textContent = `⚡ 直接连接已配对的 ${esp.name}`;
            directBtn.onclick = () => connectGatt(bluetoothDevice);
          }
        }
      } catch (e) {
        console.warn('initKnownDevices error:', e);
      }
    }
  }

  async function scanAllDevices() {
    if (!navigator.bluetooth) {
      log('Web Bluetooth API 不受当前浏览器支持。', 'error');
      return;
    }
    try {
      log('扫描所有附近蓝牙设备 (acceptAllDevices)...', 'info');
      bluetoothDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });
      await connectGatt(bluetoothDevice);
    } catch (error) {
      log('扫描已取消: ' + error.message, 'error');
      onDisconnected();
    }
  }

  function disconnect() {
    if (bluetoothDevice && bluetoothDevice.gatt.connected) {
      log('主动断开连接...', 'info');
      bluetoothDevice.gatt.disconnect();
    }
  }

  window.addEventListener('DOMContentLoaded', initKnownDevices);
  initKnownDevices();

  connectBtn.addEventListener('click', connect);
  const scanAllBtn = document.getElementById('scanAllBtn');
  if (scanAllBtn) scanAllBtn.addEventListener('click', scanAllDevices);
  disconnectBtn.addEventListener('click', disconnect);
  oneClickBtn.addEventListener('click', handleOneClick);
  clearLogBtn.addEventListener('click', () => { logBox.innerHTML = ''; });
</script>

</body>
</html>
